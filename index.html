<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D Pipeline & Portfolio Accelerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0f19;
  --card: #151c2c;
  --border: #28354d;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #6366f1;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --radius: 12px;
  --shadow: 0 4px 16px -2px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; }
body {
  margin: 0 auto;
  max-width: 680px;
  padding: 12px 14px calc(80px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 8px; color: var(--text-main); }
h3 { font-size: 0.92rem; font-weight: 600; margin: 10px 0 4px; color: var(--accent); }

nav {
  display: flex;
  gap: 4px;
  margin-bottom: 14px;
  background: var(--card);
  padding: 6px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow-x: auto;
}
nav button {
  flex: 1;
  min-width: 75px;
  padding: 10px 4px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
nav button.on {
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
}

.c {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.mu { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; }
.ok { color: var(--success); font-weight: 600; font-size: 0.85rem; }
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  background: rgba(99, 102, 241, 0.15);
  color: var(--accent);
  margin-bottom: 6px;
  margin-right: 4px;
}
.badge.warn { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
.badge.succ { background: rgba(34, 197, 94, 0.15); color: var(--success); }
.badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

.r { display: flex; gap: 8px; margin: 8px 0; }
.r > * { flex: 1; }

textarea {
  font-family: inherit;
  font-size: 0.88rem;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text-main);
  width: 100%;
  margin: 6px 0 10px;
  height: 100px;
  resize: vertical;
}

.b {
  padding: 10px 14px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  width: 100%;
  margin-top: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
}
.b.gpt { background: #10a37f; }
.b.claude { background: #d97706; }
.b.gemini { background: #2563eb; }

.param-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 8px;
  margin: 10px 0;
}
.param-card {
  background: var(--bg);
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 0.8rem;
}
.param-card strong { display: block; color: var(--text-muted); font-size: 0.7rem; }
.param-card span { font-size: 0.92rem; font-weight: 700; color: var(--accent); }

.tab-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.chip {
  padding: 6px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.78rem;
  white-space: nowrap;
  cursor: pointer;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: white; }

#toast {
  position: fixed; left: 16px; right: 16px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--text-main); color: var(--bg);
  padding: 12px 18px; border-radius: 10px; opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  transform: translateY(10px); pointer-events: none;
  text-align: center; font-weight: 600; font-size: 0.88rem;
  box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); z-index: 1000;
}
#toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let S = {
  profile: {
    level: "Unassessed",
    readinessScore: 0,
    parameters: {
      topologyEdgeFlow: 0, uvTexelDensity: 0, pbrShadingCalibration: 0,
      hardSurfacePrecision: 0, proceduralHoudini: 0, unrealEngineOptimization: 0,
      assetModularization: 0, bakeQualityHighToLow: 0, presentationStudioLighting: 0,
      pipelineNamingStandards: 0, realismScaleAccuracy: 0, portfolioCompleteness: 0
    },
    strengths: [], weaknesses: [],
    niches: ["Hard-Surface & Props", "Houdini & Procedural", "Environment & Unreal", "VFX & Assets"],
    summary: "3D Asset Artist | Maya, Houdini, ZBrush, Substance, Unreal Engine.",
    reviewHistory: []
  },
  projects: [],
  portfolio: {
    activePieces: ["Legacy Portfolio Base"],
    archivedPieces: []
  },
  jobs: []
};

let tab = "Profile", activeCategory = "All";

try {
  const item = localStorage.getItem("jh_v3");
  if (item) Object.assign(S, JSON.parse(item));
} catch(e) {}

const save = () => {
  try { localStorage.setItem("jh_v3", JSON.stringify(S)); } catch(e) {}
};

function toast(m) {
  const t = $("toast");
  if (!t) return;
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(window.tt);
  window.tt = setTimeout(() => t.classList.remove("show"), 3200);
}

function copyAndLaunch(targetApp, promptText) {
  navigator.clipboard.writeText(promptText).then(() => {
    toast("Prompt copied! Opening " + targetApp + "...");
    setTimeout(() => {
      if (targetApp === "ChatGPT") window.open("https://chatgpt.com", "_blank");
      if (targetApp === "Claude") window.open("https://claude.ai", "_blank");
      if (targetApp === "Gemini") window.open("https://gemini.google.com/app", "_blank");
    }, 600);
  }).catch(() => {
    toast("Copy failed. Please copy manually.");
  });
}
</script>
<script>
// --- PROMPT GENERATORS ---

function getHarshReviewPrompt() {
  return `ACT AS: AAA Studio Lead Art Director (ILM, Epic Games).
TASK: Perform a brutally honest 12-parameter evaluation of my attached 3D Portfolio / PDF.

CURRENT PROFILE:
${S.profile.summary}

ACTIVE PORTFOLIO PIECES:
${S.portfolio.activePieces.join("\n")}

Return ONLY valid JSON matching this exact structure:
{
  "type": "review",
  "level": "Junior | Mid-Level | Senior",
  "readinessScore": 65,
  "harshVerdict": "Brutal 1-sentence assessment of studio readiness.",
  "parameters": {
    "topologyEdgeFlow": 70, "uvTexelDensity": 60, "pbrShadingCalibration": 75,
    "hardSurfacePrecision": 80, "proceduralHoudini": 50, "unrealEngineOptimization": 40,
    "assetModularization": 55, "bakeQualityHighToLow": 70, "presentationStudioLighting": 65,
    "pipelineNamingStandards": 60, "realismScaleAccuracy": 75, "portfolioCompleteness": 50
  },
  "strengths": ["Strong PBR metalness calibration"],
  "weaknesses": ["Inconsistent texel density", "Unoptimized UV packing"],
  "niches": ["Hard-Surface & Props", "Houdini & Procedural", "Environment & Unreal", "VFX & Assets"],
  "summary": "Updated candidate summary."
}`;
}

function getStudioProjectPrompt() {
  return `ACT AS: Lead Technical Art Director.
TASK: Create a strict AAA Studio Project Brief targeted specifically at my profile weaknesses.

CURRENT WEAKNESSES:
${S.profile.weaknesses.join("; ") || "Inconsistent texel density, unoptimized UV packing"}

Return ONLY valid JSON matching this exact structure:
{
  "type": "project",
  "id": "proj_${Date.now()}",
  "title": "AAA Cyberpunk Weapon Asset",
  "category": "Hard-Surface & Props",
  "studioContext": "AAA FPS Title Asset",
  "targetWeaknessBridged": "Texel Density & UDIM Packing",
  "techSpecs": {
    "polycountBudget": "40,000 Tris max",
    "textureResolution": "2x 4K PBR UDIM sets",
    "texelDensityTarget": "10.24 px/cm at 1m",
    "engineTarget": "Unreal Engine 5.4"
  },
  "phases": [
    "Phase 1: Blockout & Grid Snapping",
    "Phase 2: High Poly Beveling & ZBrush Detail",
    "Phase 3: Low Poly & Texel Density UV Calibration",
    "Phase 4: Substance PBR Texturing",
    "Phase 5: UE5 Lookdev & Lighting Render"
  ],
  "commonPitfallsToAvoid": ["Overlapping UVs on visible faces", "Stretched normal maps"],
  "signoffCriteria": "Mesh must pass zero-error PBR bake and 10.24 px/cm density check."
}`;
}

function getWIPReviewPrompt(pId) {
  const p = S.projects.find(x => x.id === pId);
  if (!p) return "";
  return `ACT AS: Lead Art Director.
TASK: Review attached WIP screenshots for project: "${p.title}".

PROJECT SPECS:
- Poly Budget: ${p.techSpecs?.polycountBudget}
- Texel Density: ${p.techSpecs?.texelDensityTarget}
- Sign-Off Criteria: ${p.signoffCriteria}

INSTRUCTIONS:
Inspect attached WIP images against the specs. If it meets AAA studio standards, set "status" to "completed". Otherwise set "status" to "in_progress".

Return ONLY valid JSON:
{
  "type": "wip_review",
  "projectId": "${p.id}",
  "status": "completed",
  "artDirectorFeedback": "Topology edge flow and texel density pass studio bar. Approved for portfolio.",
  "requiredFixes": []
}`;
}

function getCuratePortfolioPrompt() {
  const completed = S.projects.filter(p => p.status === "completed");
  return `ACT AS: Portfolio Strategist & Art Director.
TASK: Curate my portfolio PDF structure by incorporating newly COMPLETED AAA studio projects and pruning weak/outdated pieces.

COMPLETED PROJECTS READY FOR PORTFOLIO:
${completed.map(c => `- ${c.title} (${c.category}): Bridges${c.targetWeaknessBridged}`).join("\n") || "None completed yet"}

CURRENT PORTFOLIO PIECES:
${S.portfolio.activePieces.join("\n")}

Return ONLY valid JSON matching this exact structure:
{
  "type": "curation",
  "activePieces": ["New AAA Cyberpunk Weapon Asset", "Updated Environment Modular Kit"],
  "archivedPieces": ["Old 2023 Low-Poly Prop"],
  "pdfLayoutRecommendation": "Lead with new Cyberpunk Weapon showcasing UDIM density breakdowns, followed by Modular Environment Kit.",
  "updatedSummary": "Updated portfolio profile summary."
}`;
}

function getCategorizedJobsPrompt() {
  return `ACT AS: 3D Talent Scout.
TASK: Use WEB SEARCH to find CURRENT 3D job openings matching my profile.

CANDIDATE PROFILE:
- Level: ${S.profile.level} (Readiness: ${S.profile.readinessScore}/100)
- Active Portfolio Assets: ${S.portfolio.activePieces.join(", ")}
- Niches: ${S.profile.niches.join(", ")}

Return ONLY a valid JSON array of jobs:
[
  {
    "title": "3D Hard Surface Asset Artist",
    "company": "Studio Name",
    "location": "Remote / Location",
    "url": "https://direct-job-link.com",
    "category": "Hard-Surface & Props",
    "fitScore": 90,
    "fitReason": "Matches Maya, ZBrush, and Substance Painter stack.",
    "summary": "2-sentence role overview."
  }
]`;
}

// --- DATA IMPORT PARSER ---

function parseAndImportJSON() {
  const raw = $("importArea").value.trim();
  if (!raw) return toast("Paste JSON output first.");
  try {
    const clean = raw.replace(/```json|```/g, "").trim();
    const data = JSON.parse(clean);

    if (data.type === "review" || data.parameters) {
      const p = S.profile;
      p.level = data.level || p.level;
      p.readinessScore = data.readinessScore || p.readinessScore;
      if (data.summary) p.summary = data.summary;
      if (data.parameters) Object.assign(p.parameters, data.parameters);
      if (Array.isArray(data.strengths)) p.strengths = [...new Set([...p.strengths, ...data.strengths])];
      if (Array.isArray(data.weaknesses)) p.weaknesses = [...new Set([...p.weaknesses, ...data.weaknesses])];
      if (Array.isArray(data.niches)) p.niches = [...new Set([...p.niches, ...data.niches])];
      save(); draw();
      toast("Incremental Profile updated!");
    } 
    else if (data.type === "project" || data.studioContext) {
      data.id = data.id || ("proj_" + Date.now());
      data.status = "in_progress";
      data.wipFeedback = [];
      S.projects.unshift(data);
      save(); draw();
      toast("Studio Project Brief added!");
    } 
    else if (data.type === "wip_review" || data.projectId) {
      const proj = S.projects.find(x => x.id === data.projectId);
      if (proj) {
        proj.status = data.status || proj.status;
        if (!proj.wipFeedback) proj.wipFeedback = [];
        proj.wipFeedback.unshift({
          date: new Date().toISOString().slice(0, 10),
          feedback: data.artDirectorFeedback,
          fixes: data.requiredFixes || []
        });
        save(); draw();
        toast(proj.status === "completed" ? "Project APPROVED & Marked Completed!" : "WIP Feedback Logged!");
      }
    } 
    else if (data.type === "curation" || data.activePieces) {
      if (Array.isArray(data.activePieces)) S.portfolio.activePieces = data.activePieces;
      if (Array.isArray(data.archivedPieces)) S.portfolio.archivedPieces = data.archivedPieces;
      if (data.updatedSummary) S.profile.summary = data.updatedSummary;
      save(); draw();
      toast("Portfolio Curated & Old Assets Archived!");
    } 
    else if (Array.isArray(data)) {
      S.jobs = data;
      save(); draw();
      toast(data.length + " jobs imported!");
    }
    $("importArea").value = "";
  } catch(e) {
    toast("JSON Parsing Error: " + e.message);
  }
}

// --- TAB VIEWS ---

function profileV() {
  const p = S.profile;
  const paramCards = Object.keys(p.parameters).map(k => `
    <div class="param-card">
      <strong>${k.replace(/([A-Z])/g, ' $1')}</strong>
      <span>${p.parameters[k]}/100</span>
    </div>
  `).join("");

  return `
    <div class="c">
      <h2>Living Profile</h2>
      <div class="r">
        <span class="badge succ">Level: ${esc(p.level)}</span>
        <span class="badge">Readiness: ${p.readinessScore}/100</span>
      </div>
      <div class="mu" style="margin-top:4px;">${esc(p.summary)}</div>
      
      <h3>12 Scientific Studio Parameters</h3>
      <div class="param-grid">${paramCards}</div>
      
      <h3>Weaknesses to Bridge</h3>
      <div>${p.weaknesses.map(w => `<span class="badge warn">⚠ ${esc(w)}</span>`).join("") || '<span class="mu">None logged.</span>'}</div>
    </div>

    <div class="c">
      <h2>Run 12-Parameter Harsh Review</h2>
      <div class="mu">Copies prompt & launches LLM. Attach portfolio PDF to receive structured evaluation.</div>
      <div class="r">
        <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getHarshReviewPrompt())">ChatGPT</button>
        <button class="b claude" onclick="copyAndLaunch('Claude', getHarshReviewPrompt())">Claude</button>
        <button class="b gemini" onclick="copyAndLaunch('Gemini', getHarshReviewPrompt())">Gemini</button>
      </div>
    </div>

    <div class="c">
      <h2>Sync Data / Import JSON</h2>
      <textarea id="importArea" placeholder="Paste JSON response from LLM here..."></textarea>
      <button class="b" onclick="parseAndImportJSON()">Import & Sync App</button>
    </div>
  `;
}

function projectsV() {
  const cards = S.projects.map(p => {
    const isDone = p.status === "completed";
    const statusBadge = isDone 
      ? `<span class="badge succ">✓ COMPLETED (Passed Art Director Review)</span>`
      : `<span class="badge warn">⏳ IN PROGRESS (Awaiting WIP Approval)</span>`;

    const feedbackHtml = (p.wipFeedback || []).map(f => `
      <div class="param-card" style="margin-top:6px;">
        <strong>${f.date} Feedback:</strong>
        <div style="font-size:0.8rem; color:var(--text-main);">${esc(f.feedback)}</div>
      </div>
    `).join("");

    return `
      <div class="c">
        ${statusBadge}
        <h2>${esc(p.title)}</h2>
        <div class="mu"><b>Context:</b> ${esc(p.studioContext)}</div>
        <div class="ok" style="margin:4px 0;">Targeting Weakness: ${esc(p.targetWeaknessBridged)}</div>

        <h3>Technical Specs</h3>
        <div class="param-grid">
          <div class="param-card"><strong>Budget</strong>${esc(p.techSpecs?.polycountBudget)}</div>
          <div class="param-card"><strong>Textures</strong>${esc(p.techSpecs?.textureResolution)}</div>
          <div class="param-card"><strong>Texel Density</strong>${esc(p.techSpecs?.texelDensityTarget)}</div>
          <div class="param-card"><strong>Engine</strong>${esc(p.techSpecs?.engineTarget)}</div>
        </div>

        ${!isDone ? `
          <h3>Submit WIP Pictures for Review</h3>
          <div class="mu">Copy prompt, open LLM, and attach WIP screenshots. Import JSON feedback to complete this project.</div>
          <div class="r">
            <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getWIPReviewPrompt('${p.id}'))">WIP ➔ ChatGPT</button>
            <button class="b claude" onclick="copyAndLaunch('Claude', getWIPReviewPrompt('${p.id}'))">WIP ➔ Claude</button>
            <button class="b gemini" onclick="copyAndLaunch('Gemini', getWIPReviewPrompt('${p.id}'))">WIP ➔ Gemini</button>
          </div>
        ` : ''}

        ${feedbackHtml ? `<h3>Review History</h3>${feedbackHtml}` : ''}
      </div>
    `;
  }).join("");

  return `
    <div class="c">
      <h2>Generate Target Studio Project</h2>
      <div class="mu">Generates an ultra-detailed brief targeting your specific profile weaknesses.</div>
      <div class="r">
        <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getStudioProjectPrompt())">ChatGPT</button>
        <button class="b claude" onclick="copyAndLaunch('Claude', getStudioProjectPrompt())">Claude</button>
        <button class="b gemini" onclick="copyAndLaunch('Gemini', getStudioProjectPrompt())">Gemini</button>
      </div>
    </div>
    ${cards || '<div class="c mu" style="text-align:center;">No projects created yet.</div>'}
  `;
}

function portfolioV() {
  const activeList = S.portfolio.activePieces.map(a => `<li><b>${esc(a)}</b></li>`).join("");
  const archivedList = S.portfolio.archivedPieces.map(a => `<li style="color:var(--danger);">${esc(a)} (Pruned)</li>`).join("");

  return `
    <div class="c">
      <h2>Portfolio Curation & PDF Generator</h2>
      <div class="mu">Once projects are marked <b>COMPLETED</b>, run this prompt to let the LLM prune old/weak assets and structure your new showcase PDF.</div>
      <div class="r">
        <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getCuratePortfolioPrompt())">ChatGPT</button>
        <button class="b claude" onclick="copyAndLaunch('Claude', getCuratePortfolioPrompt())">Claude</button>
        <button class="b gemini" onclick="copyAndLaunch('Gemini', getCuratePortfolioPrompt())">Gemini</button>
      </div>
    </div>

    <div class="c">
      <h2>Current Active Showcase</h2>
      <ul style="font-size:0.88rem; padding-left:18px;">${activeList || '<li>No active pieces.</li>'}</ul>

      <h3>Archived / Removed Legacy Projects</h3>
      <ul style="font-size:0.85rem; padding-left:18px;">${archivedList || '<li class="mu">None archived yet.</li>'}</ul>
    </div>

    <div class="c">
      <h2>Next Step: Trigger Re-Evaluation</h2>
      <div class="mu">After updating your portfolio PDF with new completed assets, return to the <b>Profile</b> tab and run a new <b>12-Parameter Harsh Review</b> to elevate your readiness score.</div>
      <button class="b" onclick="tab='Profile';draw()">Go to Profile & Re-Evaluate</button>
    </div>
  `;
}

function jobsV() {
  const categories = ["All", ...S.profile.niches];
  const filterChips = categories.map(cat => `
    <div class="chip ${cat === activeCategory ? 'active' : ''}" onclick="activeCategory='${cat}';draw()">${esc(cat)}</div>
  `).join("");

  const filteredJobs = activeCategory === "All" ? S.jobs : S.jobs.filter(j => j.category === activeCategory);
  const jobCards = filteredJobs.map(j => `
    <div class="c">
      <span class="badge">${esc(j.category || "3D Asset")}</span>
      <span class="badge succ">Fit Score: ${j.fitScore}/100</span>
      <h2>${esc(j.title)}</h2>
      <div class="mu">${esc(j.company)} &middot; ${esc(j.location)}</div>
      <p style="font-size:0.88rem; margin:8px 0;">${esc(j.fitReason)}</p>
      <a href="${esc(j.url)}" target="_blank" class="b">Apply for Job</a>
    </div>
  `).join("");

  return `
    <div class="c">
      <h2>Find Categorized Jobs</h2>
      <div class="mu">Uses your active portfolio & living profile to search current job openings.</div>
      <div class="r">
        <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getCategorizedJobsPrompt())">ChatGPT</button>
        <button class="b claude" onclick="copyAndLaunch('Claude', getCategorizedJobsPrompt())">Claude</button>
        <button class="b gemini" onclick="copyAndLaunch('Gemini', getCategorizedJobsPrompt())">Gemini</button>
      </div>
    </div>

    <div class="tab-chips">${filterChips}</div>
    ${jobCards || '<div class="c mu" style="text-align:center;">No jobs imported yet.</div>'}
  `;
}

function draw() {
  const app = $("app");
  const navBtns = ["Profile", "Projects", "Portfolio", "Jobs"].map(n => `
    <button class="${n === tab ? "on" : ""}" onclick="tab='${n}';draw()">${n}</button>
  `).join("");

  const bodyContent = tab === "Profile" ? profileV() : tab === "Projects" ? projectsV() : tab === "Portfolio" ? portfolioV() : jobsV();
  app.innerHTML = `<nav>${navBtns}</nav>` + bodyContent;
}

draw();
</script>
</body>
