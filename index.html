<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D Studio Pipeline & Career Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0e17;
  --card: #141b2d;
  --card-sub: #1b2438;
  --border: #26334d;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #6366f1;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --radius: 12px;
  --shadow: 0 4px 20px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; }
body {
  margin: 0 auto;
  max-width: 700px;
  padding: 12px 14px calc(80px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h2 { font-size: 1.15rem; font-weight: 700; margin: 0 0 8px; color: var(--text-main); }
h3 { font-size: 0.95rem; font-weight: 600; margin: 12px 0 6px; color: var(--accent); }

nav {
  display: flex;
  gap: 4px;
  margin-bottom: 14px;
  background: var(--card);
  padding: 6px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow-x: auto;
}
nav button {
  flex: 1;
  min-width: 75px;
  padding: 10px 4px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
nav button.on {
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
}

.c {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.mu { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; }
.ok { color: var(--success); font-weight: 600; font-size: 0.85rem; }
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  background: rgba(99, 102, 241, 0.15);
  color: var(--accent);
  margin-bottom: 6px;
  margin-right: 4px;
}
.badge.warn { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
.badge.succ { background: rgba(34, 197, 94, 0.15); color: var(--success); }
.badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

.r { display: flex; gap: 8px; margin: 8px 0; }
.r > * { flex: 1; }

textarea {
  font-family: inherit;
  font-size: 0.88rem;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text-main);
  width: 100%;
  margin: 6px 0 10px;
  height: 90px;
  resize: vertical;
}

.b {
  padding: 10px 14px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  width: 100%;
  margin-top: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
}
.b.gpt { background: #10a37f; }
.b.claude { background: #d97706; }
.b.gemini { background: #2563eb; }

.param-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 8px;
  margin: 10px 0;
}
.param-card {
  background: var(--card-sub);
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 0.8rem;
}
.param-card strong { display: block; color: var(--text-muted); font-size: 0.7rem; }
.param-card span { font-size: 0.92rem; font-weight: 700; color: var(--accent); }

.detail-box {
  background: var(--card-sub);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  margin: 8px 0;
  font-size: 0.85rem;
}
.detail-box h4 { margin: 0 0 6px; font-size: 0.88rem; color: #fff; }

.tab-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.chip {
  padding: 6px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.78rem;
  white-space: nowrap;
  cursor: pointer;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: white; }

#toast {
  position: fixed; left: 16px; right: 16px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--text-main); color: var(--bg);
  padding: 12px 18px; border-radius: 10px; opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  transform: translateY(10px); pointer-events: none;
  text-align: center; font-weight: 600; font-size: 0.88rem;
  box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); z-index: 1000;
}
#toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let S = {
  profile: {
    level: "Unassessed",
    readinessScore: 0,
    parameters: {
      topologyEdgeFlow: 0, uvTexelDensity: 0, pbrShadingCalibration: 0,
      hardSurfacePrecision: 0, proceduralHoudini: 0, unrealEngineOptimization: 0,
      assetModularization: 0, bakeQualityHighToLow: 0, presentationStudioLighting: 0,
      pipelineNamingStandards: 0, realismScaleAccuracy: 0, portfolioCompleteness: 0
    },
    strengths: [], weaknesses: [],
    niches: ["Hard-Surface & Props", "Houdini & Procedural", "Environment & Unreal", "VFX & Assets"],
    summary: "Abdelrahman Hamada | 3D Asset & Environment Artist. Maya, Houdini, ZBrush, Substance, Unreal Engine.",
    reviewHistory: []
  },
  projects: [],
  portfolio: {
    activePieces: ["Base Legacy Portfolio"],
    archivedPieces: []
  },
  jobs: []
};

let tab = "Profile", activeCategory = "All";

try {
  const item = localStorage.getItem("jh_v4");
  if (item) Object.assign(S, JSON.parse(item));
} catch(e) {}

const save = () => {
  try { localStorage.setItem("jh_v4", JSON.stringify(S)); } catch(e) {}
};

function toast(m) {
  const t = $("toast");
  if (!t) return;
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(window.tt);
  window.tt = setTimeout(() => t.classList.remove("show"), 3200);
}

function copyAndLaunch(targetApp, promptText) {
  navigator.clipboard.writeText(promptText).then(() => {
    toast("Prompt copied! Opening " + targetApp + "...");
    setTimeout(() => {
      if (targetApp === "ChatGPT") window.open("https://chatgpt.com", "_blank");
      if (targetApp === "Claude") window.open("https://claude.ai", "_blank");
      if (targetApp === "Gemini") window.open("https://gemini.google.com/app", "_blank");
    }, 600);
  }).catch(() => {
    toast("Copy failed. Please copy manually.");
  });
}

// --- PROMPT GENERATORS ---

function getHarshReviewPrompt() {
  return `ACT AS: AAA Studio Lead Art Director (ILM, Epic Games, Weta Digital).
TASK: Perform a brutally honest 12-parameter evaluation of my attached 3D Portfolio / PDF against real studio production benchmarks.

CURRENT PROFILE SUMMARY:
${S.profile.summary}

ACTIVE SHOWCASE PIECES:
${S.portfolio.activePieces.join("\n")}

CRITICAL INSTRUCTION: Return ONLY valid JSON matching this exact structure:
{
  "type": "review",
  "level": "Junior | Mid-Level | Senior",
  "readinessScore": 65,
  "harshVerdict": "Brutally honest 1-sentence assessment of production readiness.",
  "parameters": {
    "topologyEdgeFlow": 70, "uvTexelDensity": 60, "pbrShadingCalibration": 75,
    "hardSurfacePrecision": 80, "proceduralHoudini": 50, "unrealEngineOptimization": 40,
    "assetModularization": 55, "bakeQualityHighToLow": 70, "presentationStudioLighting": 65,
    "pipelineNamingStandards": 60, "realismScaleAccuracy": 75, "portfolioCompleteness": 50
  },
  "strengths": ["Clear edge loop flow on hard-surface props", "PBR roughness maps calibrated"],
  "weaknesses": ["Inconsistent texel density across modular kits", "Lack of vertex-painted shader wear"],
  "niches": ["Hard-Surface & Props", "Houdini & Procedural", "Environment & Unreal", "VFX & Assets"],
  "summary": "Updated candidate profile summary incorporating these new findings."
}`;
}

function getStudioProjectPrompt() {
  return `ACT AS: Senior Art Director at a AAA Game & VFX Studio.
TASK: Generate an ULTRA-DETAILED, FULLY-SPECIFIED AAA Studio Production Assignment to bridge my current profile weaknesses.

CURRENT WEAKNESSES TO BRIDGE:
${S.profile.weaknesses.join("\n") || "Inconsistent texel density, unoptimized UV packing, lack of modular grid snapping"}

DO NOT GENERATE VAGUE OR GENERIC TITLES. Be extremely specific about environment themes, narrative lore, visual art pillars, kit piece lists, and exact engine budgets.

CRITICAL INSTRUCTION: Return ONLY valid JSON matching this exact structure:
{
  "type": "project",
  "id": "proj_${Date.now()}",
  "title": "Subterranean Soviet Bio-Lab Containment Module",
  "category": "Environment & Unreal",
  "environmentType": "Abandoned 1980s Cold War Underground Chemical Facility",
  "narrativeLore": "Deep underground biological research facility abandoned after an industrial chemical breach. Cold, damp, heavy industrial machinery, rusted steel beams, shattered blast glass, and emergency fluorescent lighting.",
  "artDirectionPillars": {
    "style": "Industrial Utilitarian Realism with heavy environmental decay",
    "visualReferences": "Alien Isolation architecture + Control facility layout + Chernobyl interiors",
    "colorPalette": "Corroded dark olive metals, rusted iron, sickly fluorescent cyan, flashing emergency amber"
  },
  "targetWeaknessBridged": "Modular Grid Snapping, 10.24 px/cm Texel Density & Trim Sheet Optimization",
  "modularKitBreakdown": {
    "trimSheets": [
      "1x 4K Primary Trim Sheet (Heavy bevels, steel floor grates, wall trim, conduit pipes)",
      "1x 4K Concrete Tileable Map (Dirty concrete floor & ceiling slabs with vertex painted moisture)"
    ],
    "wallAndFloorKit": [
      "4m x 4m Reinforced Industrial Steel Wall Panel (3 variations)",
      "4m x 4m Door Frame Module with Pneumatic Blast Door",
      "2m x 2m Modular Floor Slab with Removable Steel Grating",
      "4m Structural Steel I-Beam Support Column with Mounting Brackets"
    ],
    "heroAsset": "Subterranean Cryo-Containment Pod with internal fluid shader, glowing status dials, and tangled pneumatic hose bundles",
    "dressingProps": ["Wall-mounted pressure gauges", "High-voltage conduit pipe runs", "Discarded hazard canisters", "Emergency alarm box"]
  },
  "techSpecs": {
    "gridSnapUnit": "Strict 1.0m and 0.5m Unreal Engine Grid Snapping",
    "polycountBudget": "Modular Walls <3,500 Tris; Hero Cryo Pod <45,000 Tris; Total Room Module <150,000 Tris",
    "texelDensityTarget": "Strict 10.24 px/cm at 1m scale (Calibrated across all UV sets)",
    "shaderRequirements": "UE5 Master Shader supporting 2-layer Vertex Color painting (Dirt & Corrosion blend) + PBR Glass shader",
    "engineTarget": "Unreal Engine 5.4 Nanite mesh workflow with Lumen GI & Volumetric Fog"
  },
  "phases": [
    "Phase 1 (Pre-Vis & Grid Calibration): Set up Maya/Houdini project with 1m grid snap. Model rough graybox layout. Calibrate 10.24 px/cm checkerboard material.",
    "Phase 2 (Trim Sheet & Master Materials): Model high-poly trim sheet details (flanges, bevels, grates). Bake 4K normal/ambient occlusion/curvature maps. Build UE5 Master Shader with vertex painting.",
    "Phase 3 (Modular Asset & Hero Sculpting): Model modular wall and floor kits matching exact 4m/2m snap pivots. High-poly ZBrush mechanical sculpt of Cryo-Pod hero asset.",
    "Phase 4 (Low Poly, UVs & PBR Texturing): UV unwrapping with 80%+ packing density. Texture Cryo-Pod and props in Substance Painter using calibrated PBR metal/roughness values.",
    "Phase 5 (UE5 Assembly, Lighting & Polish): Assemble room module in UE5. Setup cold fluorescent lighting, volumetric steam fog, custom collision, and render high-res portfolio shots in Marmoset / UE5 Movie Render Queue."
  ],
  "commonPitfallsToAvoid": [
    "Non-matching texel density between modular wall tiles and hero props",
    "Off-grid pivot points causing light leaks along modular snap seams in UE5",
    "Over-saturated roughness maps making surfaces look like wet plastic"
  ],
  "signoffCriteria": "Zero light leaks on snap seams, 10.24 px/cm density verified, PBR roughness calibrated, passes automated mesh check."
}`;
}

function getWIPReviewPrompt(pId) {
  const p = S.projects.find(x => x.id === pId);
  if (!p) return "";
  return `ACT AS: AAA Studio Lead Art Director.
TASK: Review attached WIP screenshots for project: "${p.title}".

PROJECT TECHNICAL SPECS:
- Environment Theme: ${p.environmentType || p.category}
- Target Texel Density: ${p.techSpecs?.texelDensityTarget}
- Grid Unit: ${p.techSpecs?.gridSnapUnit}
- Sign-Off Criteria: ${p.signoffCriteria}

INSTRUCTIONS:
Inspect the attached WIP screenshots against these technical specs. If the asset/environment meets production AAA standards, set "status" to "completed". Otherwise set "status" to "in_progress" and provide specific art director fixes.

Return ONLY valid JSON matching this exact structure:
{
  "type": "wip_review",
  "projectId": "${p.id}",
  "status": "completed | in_progress",
  "artDirectorFeedback": "Topology edge flow, bevel width, and texel density pass studio bar. Approved for portfolio.",
  "requiredFixes": ["Add chamfer bevel to sharp door frame edge", "Increase roughness variation on floor metal"]
}`;
}

function getCuratePortfolioPrompt() {
  const completed = S.projects.filter(p => p.status === "completed");
  return `ACT AS: Portfolio Strategist & AAA Art Director.
TASK: Curate my portfolio structure by incorporating newly COMPLETED AAA projects and pruning outdated/weak legacy pieces.

COMPLETED PROJECTS READY FOR SHOWCASE:
${completed.map(c => `- ${c.title} (${c.category}): Solves${c.targetWeaknessBridged}`).join("\n") || "None completed yet"}

CURRENT SHOWCASE PIECES:
${S.portfolio.activePieces.join("\n")}

Return ONLY valid JSON matching this exact structure:
{
  "type": "curation",
  "activePieces": ["New AAA Subterranean Soviet Bio-Lab Module", "Updated Procedural Houdini Asset Kit"],
  "archivedPieces": ["Old 2023 Low-Poly Prop"],
  "pdfLayoutRecommendation": "Lead with new Subterranean Bio-Lab showcasing UDIM texel density breakdowns and UE5 lighting passes.",
  "updatedSummary": "Updated candidate summary reflecting newly added studio-grade assets."
}`;
}

function getCategorizedJobsPrompt() {
  return `ACT AS: 3D Industry Talent Scout & Headhunter.
TASK: Use WEB SEARCH to find CURRENT, REAL 3D job openings matching my portfolio level and niches.

CANDIDATE LIVING PROFILE:
- Level: ${S.profile.level} (Readiness: ${S.profile.readinessScore}/100)
- Active Portfolio Showcase: ${S.portfolio.activePieces.join(", ")}
- Niches: ${S.profile.niches.join(", ")}
- Verified Strengths: ${S.profile.strengths.join("; ")}

CATEGORIES REQUIRED:
1. "Hard-Surface & Props"
2. "Houdini & Procedural"
3. "Environment & Unreal"
4. "VFX & Assets"

Return ONLY a valid JSON array of job postings matching this structure:
[
  {
    "title": "3D Environment & Asset Artist",
    "company": "Studio Name",
    "location": "Remote / Location",
    "url": "https://direct-job-link.com",
    "category": "Environment & Unreal",
    "fitScore": 92,
    "fitReason": "Matches Maya, Substance Painter, and Unreal Engine 5 stack.",
    "summary": "2-sentence overview of primary responsibilities."
  }
]`;
}

// --- DATA IMPORT PARSER ---

function parseAndImportJSON() {
  const raw = $("importArea").value.trim();
  if (!raw) return toast("Paste JSON output first.");
  try {
    const clean = raw.replace(/```json|```/g, "").trim();
    const data = JSON.parse(clean);

    if (data.type === "review" || (data.parameters && !data.techSpecs)) {
      const p = S.profile;
      p.level = data.level || p.level;
      p.readinessScore = data.readinessScore || p.readinessScore;
      if (data.summary) p.summary = data.summary;
      if (data.parameters) Object.assign(p.parameters, data.parameters);
      if (Array.isArray(data.strengths)) p.strengths = [...new Set([...p.strengths, ...data.strengths])];
      if (Array.isArray(data.weaknesses)) p.weaknesses = [...new Set([...p.weaknesses, ...data.weaknesses])];
      if (Array.isArray(data.niches)) p.niches = [...new Set([...p.niches, ...data.niches])];
      save(); draw();
      toast("Incremental Profile updated!");
    } 
    else if (data.type === "project" || data.modularKitBreakdown || data.narrativeLore) {
      data.id = data.id || ("proj_" + Date.now());
      data.status = "in_progress";
      data.wipFeedback = [];
      S.projects.unshift(data);
      save(); draw();
      toast("Detailed Studio Project Brief added!");
    } 
    else if (data.type === "wip_review" || data.projectId) {
      const proj = S.projects.find(x => x.id === data.projectId);
      if (proj) {
        proj.status = data.status || proj.status;
        if (!proj.wipFeedback) proj.wipFeedback = [];
        proj.wipFeedback.unshift({
          date: new Date().toISOString().slice(0, 10),
          feedback: data.artDirectorFeedback,
          fixes: data.requiredFixes || []
        });
        save(); draw();
        toast(proj.status === "completed" ? "Project APPROVED & Marked Completed!" : "WIP Feedback Logged!");
      }
    } 
    else if (data.type === "curation" || data.activePieces) {
      if (Array.isArray(data.activePieces)) S.portfolio.activePieces = data.activePieces;
      if (Array.isArray(data.archivedPieces)) S.portfolio.archivedPieces = data.archivedPieces;
      if (data.updatedSummary) S.profile.summary = data.updatedSummary;
      save(); draw();
      toast("Portfolio Curated & Old Assets Archived!");
    } 
    else if (Array.isArray(data)) {
      S.jobs = data;
      save(); draw();
      toast(data.length + " jobs imported!");
    }
    $("importArea").value = "";
  } catch(e) {
    toast("JSON Parsing Error: " + e.message);
  }
}

// --- TAB VIEWS ---

function profileV() {
  const p = S.profile;
  const paramCards = Object.keys(p.parameters).map(k => `
    <div class="param-card">
      <strong>${k.replace(/([A-Z])/g, ' $1')}</strong>
      <span>${p.parameters[k]}/100</span>
    </div>
  `).join("");

  return `
    <div class="c">
      <h2>Living Profile</h2>
      <div class="r">
        <span class="badge succ">Level: ${esc(p.level)}</span>
        <span class="badge">Readiness: ${p.readinessScore}/100</span>
      </div>
      <div class="mu" style="margin-top:4px;">${esc(p.summary)}</div>
      
      <h3>12 Scientific Studio Parameters</h3>
      <div class="param-grid">${paramCards}</div>
      
      <h3>Weaknesses to Bridge</h3>
      <div>${p.weaknesses.map(w => `<span class="badge warn">⚠ ${esc(w)}</span>`).join("") || '<span class="mu">None logged yet.</span>'}</div>
    </div>

    <div class="c">
      <h2>Run 12-Parameter Harsh Review</h2>
      <div class="mu">Copies evaluation prompt & launches LLM. Attach portfolio PDF to update candidate parameters.</div>
      <div class="r">
        <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getHarshReviewPrompt())">ChatGPT</button>
        <button class="b claude" onclick="copyAndLaunch('Claude', getHarshReviewPrompt())">Claude</button>
        <button class="b gemini" onclick="copyAndLaunch('Gemini', getHarshReviewPrompt())">Gemini</button>
      </div>
    </div>

    <div class="c">
      <h2>Sync Data / Import JSON</h2>
      <textarea id="importArea" placeholder="Paste JSON response from LLM here..."></textarea>
      <button class="b" onclick="parseAndImportJSON()">Import & Sync App</button>
    </div>
  `;
}

function projectsV() {
  const cards = S.projects.map(p => {
    const isDone = p.status === "completed";
    const statusBadge = isDone 
      ? `<span class="badge succ">✓ COMPLETED (Passed Art Director Review)</span>`
      : `<span class="badge warn">⏳ IN PROGRESS (Awaiting WIP Approval)</span>`;

    const kit = p.modularKitBreakdown || {};
    const art = p.artDirectionPillars || {};

    const feedbackHtml = (p.wipFeedback || []).map(f => `
      <div class="param-card" style="margin-top:6px;">
        <strong>${f.date} Art Director Feedback:</strong>
        <div style="font-size:0.82rem; color:var(--text-main); margin-top:2px;">${esc(f.feedback)}</div>
        ${(f.fixes && f.fixes.length) ? `<div style="font-size:0.78rem; color:var(--danger); margin-top:4px;"><b>Fixes:</b> ${f.fixes.map(esc).join(", ")}</div>` : ''}
      </div>
    `).join("");

    return `
      <div class="c">
        ${statusBadge}
        <h2>${esc(p.title)}</h2>
        <div class="mu"><b>Environment Theme:</b> ${esc(p.environmentType || p.category)}</div>
        <div class="ok" style="margin:4px 0;">Targeting Weakness: ${esc(p.targetWeaknessBridged)}</div>

        ${p.narrativeLore ? `
          <div class="detail-box">
            <h4>Narrative Lore & Backstory</h4>
            <div class="mu">${esc(p.narrativeLore)}</div>
          </div>
        ` : ''}

        ${art.style ? `
          <div class="detail-box">
            <h4>Art Direction Pillars</h4>
            <div style="font-size:0.8rem;"><b>Style:</b> ${esc(art.style)}</div>
            <div style="font-size:0.8rem;"><b>Visual References:</b> ${esc(art.visualReferences)}</div>
            <div style="font-size:0.8rem;"><b>Color Palette:</b> ${esc(art.colorPalette)}</div>
          </div>
        ` : ''}

        <h3>Modular Kit & Asset Breakdown</h3>
        <div class="detail-box">
          ${kit.trimSheets ? `<div><b>Trim Sheets:</b> <ul style="margin:2px 0 6px; padding-left:18px;">${kit.trimSheets.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ''}
          ${kit.wallAndFloorKit ? `<div><b>Modular Walls & Floors:</b> <ul style="margin:2px 0 6px; padding-left:18px;">${kit.wallAndFloorKit.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ''}
          ${kit.heroAsset ? `<div><b>Hero Asset:</b> ${esc(kit.heroAsset)}</div>` : ''}
          ${kit.dressingProps ? `<div style="margin-top:4px;"><b>Dressing Props:</b> ${esc(kit.dressingProps.join(", "))}</div>` : ''}
        </div>

        <h3>Technical Specifications</h3>
        <div class="param-grid">
          <div class="param-card"><strong>Grid Unit</strong>${esc(p.techSpecs?.gridSnapUnit || 'N/A')}</div>
          <div class="param-card"><strong>Texel Density</strong>${esc(p.techSpecs?.texelDensityTarget || 'N/A')}</div>
          <div class="param-card"><strong>Poly Budgets</strong>${esc(p.techSpecs?.polycountBudget || 'N/A')}</div>
          <div class="param-card"><strong>Target Engine</strong>${esc(p.techSpecs?.engineTarget || 'N/A')}</div>
        </div>
        ${p.techSpecs?.shaderRequirements ? `<div class="mu" style="margin-bottom:8px;"><b>Shader Setup:</b> ${esc(p.techSpecs.shaderRequirements)}</div>` : ''}

        <h3>Production Milestone Phases</h3>
        <ol style="font-size:0.82rem; padding-left:18px;" class="mu">
          ${(p.phases || []).map(ph => `<li style="margin-bottom:4px;">${esc(ph)}</li>`).join("")}
        </ol>

        <div class="mu" style="color:var(--danger); margin-top:8px;">
          <b>Sign-Off Criteria:</b> ${esc(p.signoffCriteria)}
        </div>

        ${!isDone ? `
          <h3 style="margin-top:14px;">Submit WIP Pictures for Approval</h3>
          <div class="mu">Copy WIP review prompt, launch LLM, attach progress screenshots. Import JSON response to complete project.</div>
          <div class="r">
            <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getWIPReviewPrompt('${p.id}'))">WIP ➔ ChatGPT</button>
            <button class="b claude" onclick="copyAndLaunch('Claude', getWIPReviewPrompt('${p.id}'))">WIP ➔ Claude</button>
            <button class="b gemini" onclick="copyAndLaunch('Gemini', getWIPReviewPrompt('${p.id}'))">WIP ➔ Gemini</button>
          </div>
        ` : ''}

        ${feedbackHtml ? `<h3>Review History</h3>${feedbackHtml}` : ''}
      </div>
    `;
  }).join("");

  return `
    <div class="c">
      <h2>Generate AAA Studio Brief</h2>
      <div class="mu">Generates an ultra-detailed studio assignment complete with narrative lore, trim sheets, modular kit lists, and tech budgets.</div>
      <div class="r">
        <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getStudioProjectPrompt())">ChatGPT</button>
        <button class="b claude" onclick="copyAndLaunch('Claude', getStudioProjectPrompt())">Claude</button>
        <button class="b gemini" onclick="copyAndLaunch('Gemini', getStudioProjectPrompt())">Gemini</button>
      </div>
    </div>
    ${cards || '<div class="c mu" style="text-align:center;">No project briefs generated yet.</div>'}
  `;
}

function portfolioV() {
  const activeList = S.portfolio.activePieces.map(a => `<li><b>${esc(a)}</b></li>`).join("");
  const archivedList = S.portfolio.archivedPieces.map(a => `<li style="color:var(--danger);">${esc(a)} (Pruned)</li>`).join("");

  return `
    <div class="c">
      <h2>Portfolio Curation</h2>
      <div class="mu">Once projects are marked <b>COMPLETED</b>, run this prompt to let the LLM prune outdated legacy assets and restructure your showcase PDF layout.</div>
      <div class="r">
        <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getCuratePortfolioPrompt())">ChatGPT</button>
        <button class="b claude" onclick="copyAndLaunch('Claude', getCuratePortfolioPrompt())">Claude</button>
        <button class="b gemini" onclick="copyAndLaunch('Gemini', getCuratePortfolioPrompt())">Gemini</button>
      </div>
    </div>

    <div class="c">
      <h2>Active Showcase Assets</h2>
      <ul style="font-size:0.88rem; padding-left:18px;">${activeList || '<li>No active pieces.</li>'}</ul>

      <h3>Archived / Removed Assets</h3>
      <ul style="font-size:0.85rem; padding-left:18px;">${archivedList || '<li class="mu">None archived yet.</li>'}</ul>
    </div>

    <div class="c">
      <h2>Trigger Re-Evaluation</h2>
      <div class="mu">After assembling your updated PDF with new completed assets, return to the <b>Profile</b> tab and run a new <b>12-Parameter Harsh Review</b> to elevate your readiness score.</div>
      <button class="b" onclick="tab='Profile';draw()">Go to Profile & Re-Evaluate</button>
    </div>
  `;
}

function jobsV() {
  const categories = ["All", ...S.profile.niches];
  const filterChips = categories.map(cat => `
    <div class="chip ${cat === activeCategory ? 'active' : ''}" onclick="activeCategory='${cat}';draw()">${esc(cat)}</div>
  `).join("");

  const filteredJobs = activeCategory === "All" ? S.jobs : S.jobs.filter(j => j.category === activeCategory);
  const jobCards = filteredJobs.map(j => `
    <div class="c">
      <span class="badge">${esc(j.category || "3D Asset")}</span>
      <span class="badge succ">Fit Score: ${j.fitScore}/100</span>
      <h2>${esc(j.title)}</h2>
      <div class="mu">${esc(j.company)} &middot; ${esc(j.location)}</div>
      <p style="font-size:0.88rem; margin:8px 0;">${esc(j.fitReason)}</p>
      <a href="${esc(j.url)}" target="_blank" class="b">Apply for Job</a>
    </div>
  `).join("");

  return `
    <div class="c">
      <h2>Find Categorized Jobs</h2>
      <div class="mu">Uses your active portfolio & living profile parameters to search real open positions.</div>
      <div class="r">
        <button class="b gpt" onclick="copyAndLaunch('ChatGPT', getCategorizedJobsPrompt())">ChatGPT</button>
        <button class="b claude" onclick="copyAndLaunch('Claude', getCategorizedJobsPrompt())">Claude</button>
        <button class="b gemini" onclick="copyAndLaunch('Gemini', getCategorizedJobsPrompt())">Gemini</button>
      </div>
    </div>

    <div class="tab-chips">${filterChips}</div>
    ${jobCards || '<div class="c mu" style="text-align:center;">No jobs imported yet.</div>'}
  `;
}

function draw() {
  const app = $("app");
  const navBtns = ["Profile", "Projects", "Portfolio", "Jobs"].map(n => `
    <button class="${n === tab ? "on" : ""}" onclick="tab='${n}';draw()">${n}</button>
  `).join("");

  const bodyContent = tab === "Profile" ? profileV() : tab === "Projects" ? projectsV() : tab === "Portfolio" ? portfolioV() : jobsV();
  app.innerHTML = `<nav>${navBtns}</nav>` + bodyContent;
}

draw();
</script>
</body>
</html>
